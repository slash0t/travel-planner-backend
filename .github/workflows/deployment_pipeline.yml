name: pipeline

on: 
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: service_secrets

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: travelPlannerDB
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5438:5432

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - uses: oNaiPs/secrets-to-env-action@v1
      with:
        secrets: ${{ toJSON(secrets) }}
        exclude: SPRING_DATASOURCE_URL

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven

    - name: Run migrations
      run: mvn liquibase:update

    - name: Compile project
      run: mvn compile

    - name: Run tests
      run: mvn test

    - name: Package application
      run: mvn package

    - name: Upload auth JAR
      uses: actions/upload-artifact@v4
      with:
        name: auth-target.jar
        path: auth/target/*SNAPSHOT.jar
        if-no-files-found: error

    - name: Upload external JAR
      uses: actions/upload-artifact@v4
      with:
        name: external-target.jar
        path: external/target/*SNAPSHOT.jar
        if-no-files-found: error

    - name: Upload library JAR
      uses: actions/upload-artifact@v4
      with:
        name: library-target.jar
        path: library/target/*SNAPSHOT.jar
        if-no-files-found: error

    - name: Upload planner JAR
      uses: actions/upload-artifact@v4
      with:
        name: planner-target.jar
        path: planner/target/*SNAPSHOT.jar
        if-no-files-found: error
        
  build_and_push_auth:
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Check gh hash before pushing to registry
        run: |
          echo ${{ github.sha }}
      - name: Build and push Docker backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./auth/Dockerfile
          push: true
          tags: |
            ghcr.io/slash0t/putevod-auth:latest
            ghcr.io/slash0t/putevod-auth:${{ github.sha }}
            
  build_and_push_external:
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Check gh hash before pushing to registry
        run: |
          echo ${{ github.sha }}
      - name: Build and push Docker backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./external/Dockerfile
          push: true
          tags: |
            ghcr.io/slash0t/putevod-external:latest
            ghcr.io/slash0t/putevod-external:${{ github.sha }}
            
  build_and_push_library:
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Check gh hash before pushing to registry
        run: |
          echo ${{ github.sha }}
      - name: Build and push Docker backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./library/Dockerfile
          push: true
          tags: |
            ghcr.io/slash0t/putevod-library:latest
            ghcr.io/slash0t/putevod-library:${{ github.sha }}

  build_and_push_planner:
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Check gh hash before pushing to registry
        run: |
          echo ${{ github.sha }}
      - name: Build and push Docker backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./planner/Dockerfile
          push: true
          tags: |
            ghcr.io/slash0t/putevod-planner:latest
            ghcr.io/slash0t/putevod-planner:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_auth
      - build_and_push_library
      - build_and_push_external
      - build_and_push_planner
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: create env file
        run: |
          echo "SERVER_PORT_PLANNER=${{ secrets.SERVER_PORT_PLANNER }}" >> ./envfile
          echo "SERVER_PORT_EXTERNAL=${{ secrets.SERVER_PORT_EXTERNAL }}" >> ./envfile
          echo "SERVER_PORT_AUTH=${{ secrets.SERVER_PORT_AUTH }}" >> ./envfile
          echo "SERVER_PORT_LIBRARY=${{ secrets.SERVER_PORT_LIBRARY }}" >> ./envfile
          echo "DB_URL=${{ secrets.DB_URL }}" >> ./envfile
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> ./envfile
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> ./envfile
          echo "SPRING_SECURITY_USER=${{ secrets.SPRING_SECURITY_USER }}" >> ./envfile
          echo "SPRING_SECURITY_PASSWORD=${{ secrets.SPRING_SECURITY_PASSWORD }}" >> ./envfile
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ./envfile
          echo "JWT_ACCESS_TOKEN_EXPIRATION_MS=${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION_MS }}" >> ./envfile
          echo "JWT_REFRESH_TOKEN_EXPIRATION_MS=${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION_MS }}" >> ./envfile
          echo "JWT_ANONYMOUS_TOKEN_EXPIRATION_MS=${{ secrets.JWT_ANONYMOUS_TOKEN_EXPIRATION_MS }}" >> ./envfile
          echo "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> ./envfile
          echo "MAIL_PORT=${{ secrets.MAIL_PORT }}" >> ./envfile
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> ./envfile
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> ./envfile
          echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> ./envfile
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> ./envfile
          echo "AUTH_SERVICE_URL=${{ secrets.AUTH_SERVICE_URL }}" >> ./envfile
          echo "PLANNER_SERVICE_URL=${{ secrets.PLANNER_SERVICE_URL }}" >> ./envfile
          echo "AUTH_SERVICE_TOKEN=${{ secrets.AUTH_SERVICE_TOKEN }}" >> ./envfile
          echo "OPENTRIPMAP_API_KEY=${{ secrets.OPENTRIPMAP_API_KEY }}" >> ./envfile
          echo "OPENTRIPMAP_BASE_URL=${{ secrets.OPENTRIPMAP_BASE_URL }}" >> ./envfile
          echo "MAX_FILE_SIZE=${{ secrets.MAX_FILE_SIZE }}" >> ./envfile
          echo "MAX_REQUEST_SIZE=${{ secrets.MAX_REQUEST_SIZE }}" >> ./envfile
          echo "LOG_LEVEL_ROOT=${{ secrets.LOG_LEVEL_ROOT }}" >> ./envfile
          echo "LOG_LEVEL_APP=${{ secrets.LOG_LEVEL_APP }}" >> ./envfile
          echo "LOG_LEVEL_SPRING_WEB=${{ secrets.LOG_LEVEL_SPRING_WEB }}" >> ./envfile
          echo "LOG_LEVEL_HIBERNATE=${{ secrets.LOG_LEVEL_HIBERNATE }}" >> ./envfile
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> ./envfile
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ./envfile
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> ./envfile
          echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" >> ./envfile
          echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> ./envfile
          echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> ./envfile
          echo "PGPORT=${{ secrets.PGPORT }}" >> ./envfile

      - name: Copy envfile to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          source: "envfile"
          target: "/home/deploy/"

      - name: Docker Stack Deploy
        uses: cssnr/stack-deploy-action@v1
        with:
          name: putevod
          file: docker-stack.yaml
          host: ${{ secrets.HOST }}
          user: deploy
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: /home/deploy/envfile
          registry_auth: true
          registry_host: "ghcr.io"
          registry_user: ${{ secrets.DEPLOY_USER }}
          registry_pass: ${{ secrets.GH_TOKEN }}