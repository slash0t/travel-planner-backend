name: pipeline

on: workflow_dispatch

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: service_secrets

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: travelPlannerDB
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5438:5432

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - uses: oNaiPs/secrets-to-env-action@v1
      with:
        secrets: ${{ toJSON(secrets) }}

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven

    - name: Run migrations
      run: mvn liquibase:update

    - name: Compile project
      run: mvn compile

    - name: Run tests
      run: mvn test

    - name: Package application
      run: mvn package

    - name: Upload auth JAR
      uses: actions/upload-artifact@v4
      with:
        name: auth-target.jar
        path: auth/target/*SNAPSHOT.jar
        if-no-files-found: error

    - name: Upload external JAR
      uses: actions/upload-artifact@v4
      with:
        name: external-target.jar
        path: external/target/*SNAPSHOT.jar
        if-no-files-found: error

    - name: Upload library JAR
      uses: actions/upload-artifact@v4
      with:
        name: library-target.jar
        path: library/target/*SNAPSHOT.jar
        if-no-files-found: error

    - name: Upload planner JAR
      uses: actions/upload-artifact@v4
      with:
        name: planner-target.jar
        path: planner/target/*SNAPSHOT.jar
        if-no-files-found: error
