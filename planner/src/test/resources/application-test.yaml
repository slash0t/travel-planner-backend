spring:
  datasource:
    url: jdbc:postgresql://localhost:5438/travelPlannerDB
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 120000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.zaxxer.hikari: WARN
    org.springframework.jdbc: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    ru.putevod.app.planner: INFO
    root: WARN 