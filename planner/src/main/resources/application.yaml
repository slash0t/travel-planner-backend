server:
  port: ${SERVER_PORT_PLANNER}

spring:
  application:
    name: putevod-planner-service

  security:
    user:
      name: ${SPRING_SECURITY_USER}
      password: ${SPRING_SECURITY_PASSWORD}

  autoconfigure:
    exclude: 
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration

  liquibase:
    enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

springdoc:
  show-actuator: false
  api-docs:
    path: /api-docs-planner
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
  packages-to-scan: ru.putevod.app.planner
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    ru.putevod.app: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
    org.springdoc: DEBUG
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG

services:
  auth:
    url: ${AUTH_SERVICE_URL}

auth:
  token: ${AUTH_SERVICE_TOKEN:service_token_for_development}
