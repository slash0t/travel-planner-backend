spring:
  application:
    name: planner-service

  liquibase:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5438/travelPlannerDB
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    ru.putevod.app: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

# Настройки внешних сервисов
services:
  auth:
    url: http://localhost:8081/api

# Токен для межсервисного взаимодействия
auth:
  token: ${AUTH_SERVICE_TOKEN:service_token_for_development}
