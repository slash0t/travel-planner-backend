server:
  port: ${SERVER_PORT_PLANNER}

spring:
  application:
    name: putevod-planner-service

  security:
    user:
      name: ${SPRING_SECURITY_USER}
      password: ${SPRING_SECURITY_PASSWORD}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration

  liquibase:
    enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 10000
      idle-timeout: 180000
      max-lifetime: 300000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

springdoc:
  show-actuator: false
  api-docs:
    path: /api-docs-planner
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: list
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    csrf:
      enabled: false
  packages-to-scan: ru.putevod.app.planner
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    ru.putevod.app: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springdoc: DEBUG
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG

services:
  auth:
    url: ${AUTH_SERVICE_URL}

auth:
  token: ${AUTH_SERVICE_TOKEN:service_token_for_development}

---
# Профиль для CI/CD среды
spring:
  config:
    activate:
      on-profile: ci
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 180000
      max-lifetime: 300000

---
# Профиль для тестирования
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 5000
