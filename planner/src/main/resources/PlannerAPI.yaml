components:
  schemas:
    TripSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        thumbnail:
          type: string
          format: uri
        status:
          type: string
          enum: [upcoming, ongoing, past]
        isShared:
          type: boolean
      required:
        - id
        - title
        - startDate
        - endDate
        - status

    TripCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        thumbnail:
          type: string
          format: uri
        isPrivate:
          type: boolean
          default: true
      required:
        - title
        - startDate
        - endDate

    TripUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        thumbnail:
          type: string
          format: uri
        isPrivate:
          type: boolean

    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        thumbnail:
          type: string
          format: uri
        status:
          type: string
          enum: [upcoming, ongoing, past]
        isPrivate:
          type: boolean
        isOwner:
          type: boolean
        owner:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - startDate
        - endDate
        - status
        - isPrivate
        - isOwner
        - owner
        - createdAt
        - updatedAt

    TripDayCreate:
      type: object
      properties:
        date:
          type: string
          format: date
        title:
          type: string
        notes:
          type: string
      required:
        - date

    TripDayUpdate:
      type: object
      properties:
        title:
          type: string
        notes:
          type: string

    TripDay:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        title:
          type: string
        notes:
          type: string
        tripId:
          type: string
          format: uuid
        places:
          type: array
          items:
            $ref: '#/components/schemas/Place'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - date
        - tripId
        - createdAt
        - updatedAt

    PlaceCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        notes:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        externalId:
          type: string
          description: ID from external service (Google Maps, etc.)
        externalSource:
          type: string
          enum: [google, yandex, manual]
          default: manual
        category:
          type: string
          enum: [attraction, restaurant, accommodation, transportation, other]
          default: other
      required:
        - name

    PlaceUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        notes:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        category:
          type: string
          enum: [attraction, restaurant, accommodation, transportation, other]

    Place:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        address:
          type: string
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        notes:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        externalId:
          type: string
        externalSource:
          type: string
          enum: [google, yandex, manual]
        category:
          type: string
          enum: [attraction, restaurant, accommodation, transportation, other]
        tripId:
          type: string
          format: uuid
        dayId:
          type: string
          format: uuid
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - tripId
        - dayId
        - createdAt
        - updatedAt

    Coordinates:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
        - latitude
        - longitude

    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        size:
          type: integer
        mimeType:
          type: string
        tripId:
          type: string
          format: uuid
        placeId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - url
        - size
        - mimeType
        - tripId
        - createdAt
        - updatedAt

    TripMapData:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        title:
          type: string
        days:
          type: array
          items:
            type: object
            properties:
              dayId:
                type: string
                format: uuid
              date:
                type: string
                format: date
              places:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    coordinates:
                      $ref: '#/components/schemas/Coordinates'
                    order:
                      type: integer
                    category:
                      type: string
                      enum: [attraction, restaurant, accommodation, transportation, other]
                  required:
                    - id
                    - name
                    - coordinates
                    - order
            required:
              - dayId
              - date
              - places
      required:
        - tripId
        - days

    Collaborator:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        permission:
          type: string
          enum: [view, edit]
        tripId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - user
        - permission
        - tripId
        - createdAt

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
          format: uri
      required:
        - id
        - username

    TodoListSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        itemCount:
          type: integer
        completedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - itemCount
        - completedCount
        - createdAt
        - updatedAt

    TodoListCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        templateId:
          type: string
          format: uuid
          description: ID of template to use for initial items
        tripId:
          type: string
          format: uuid
          description: Optional trip to associate with this todo list
        items:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              completed:
                type: boolean
                default: false
            required:
              - text
      required:
        - title

    TodoListUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        tripId:
          type: string
          format: uuid
          description: Optional trip to associate with this todo list

    TodoList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        tripId:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoItem'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - items
        - createdAt
        - updatedAt

    TodoListTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [beach, hiking, city, business, winter, summer]
        previewItems:
          type: array
          items:
            type: string
          description: Preview of some items in the template
      required:
        - id
        - title
        - category
        - previewItems

    TodoItemCreate:
      type: object
      properties:
        text:
          type: string
        completed:
          type: boolean
          default: false
      required:
        - text

    TodoItemUpdate:
      type: object
      properties:
        text:
          type: string
        completed:
          type: boolean

    TodoItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        completed:
          type: boolean
        todoListId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - text
        - completed
        - todoListId
        - createdAt
        - updatedAt

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [trip_share, trip_update, trip_reminder, system]
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        data:
          type: object
          additionalProperties: true
          description: Additional data specific to notification type
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - message
        - read
        - createdAt

    NotificationSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        tripReminders:
          type: boolean
          description: Receive reminders for upcoming trips and events
        tripUpdates:
          type: boolean
          description: Receive notifications about updates to shared trips
        tripShares:
          type: boolean
          description: Receive notifications when trips are shared with you
        systemNotifications:
          type: boolean
          description: Receive system notifications
        reminderTime:
          type: integer
          description: Minutes before an event to send a reminder
          default: 60
      required:
        - id
        - userId
        - tripReminders
        - tripUpdates
        - tripShares
        - systemNotifications
        - reminderTime

    NotificationSettingsUpdate:
      type: object
      properties:
        tripReminders:
          type: boolean
        tripUpdates:
          type: boolean
        tripShares:
          type: boolean
        systemNotifications:
          type: boolean
        reminderTime:
          type: integer
          description: Minutes before an event to send a reminder

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
