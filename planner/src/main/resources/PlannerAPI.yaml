openapi: 3.0.3
info:
  title: Travel Planner Service API
  description: API for managing travel plans, todo lists, and user interactions
  version: 1.0.0
servers:
  - url: https://api.travelplanner.com/v1/planner
    description: Main production server
  - url: https://dev-api.travelplanner.com/v1/planner
    description: Development server

tags:
  - name: trips
    description: Operations about travel plans
  - name: todo-lists
    description: Operations about todo lists
  - name: sharing
    description: Operations for sharing and collaboration
  - name: notifications
    description: Operations for managing notifications

paths:
  /trips:
    get:
      tags:
        - trips
      summary: Get all trips for the authenticated user
      description: Returns a list of all trips created by the authenticated user
      operationId: getAllTrips
      parameters:
        - name: status
          in: query
          description: Filter trips by status
          schema:
            type: string
            enum: [upcoming, ongoing, past, all]
            default: all
        - name: limit
          in: query
          description: Maximum number of trips to return
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Number of trips to skip for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  trips:
                    type: array
                    items:
                      $ref: '#/components/schemas/TripSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - trips
      summary: Create a new trip
      description: Creates a new trip for the authenticated user
      operationId: createTrip
      requestBody:
        description: Trip information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}:
    get:
      tags:
        - trips
      summary: Get trip details
      description: Returns detailed information about a specific trip
      operationId: getTripById
      parameters:
        - name: tripId
          in: path
          description: ID of the trip to retrieve
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - trips
      summary: Update trip details
      description: Updates information about a specific trip
      operationId: updateTrip
      parameters:
        - name: tripId
          in: path
          description: ID of the trip to update
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Updated trip information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Trip updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - trips
      summary: Delete a trip
      description: Deletes a specific trip
      operationId: deleteTrip
      parameters:
        - name: tripId
          in: path
          description: ID of the trip to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Trip deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/days:
    get:
      tags:
        - trips
      summary: Get all days for a trip
      description: Returns all days planned for a specific trip
      operationId: getTripDays
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripDay'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - trips
      summary: Add a new day to a trip
      description: Creates a new day for a specific trip
      operationId: addTripDay
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Day information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripDayCreate'
      responses:
        '201':
          description: Day added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/days/{dayId}:
    get:
      tags:
        - trips
      summary: Get a specific day of a trip
      description: Returns details of a specific day in a trip
      operationId: getTripDay
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          description: ID of the day
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDay'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - trips
      summary: Update a specific day of a trip
      description: Updates details of a specific day in a trip
      operationId: updateTripDay
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          description: ID of the day
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Updated day information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripDayUpdate'
      responses:
        '200':
          description: Day updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - trips
      summary: Delete a specific day from a trip
      description: Removes a specific day from a trip
      operationId: deleteTripDay
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          description: ID of the day
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Day deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/days/{dayId}/places:
    get:
      tags:
        - trips
      summary: Get all places for a specific day
      description: Returns all places planned for a specific day in a trip
      operationId: getDayPlaces
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          description: ID of the day
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - trips
      summary: Add a new place to a day
      description: Adds a new place to a specific day in a trip
      operationId: addDayPlace
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          description: ID of the day
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Place information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceCreate'
      responses:
        '201':
          description: Place added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/days/{dayId}/places/{placeId}:
    get:
      tags:
        - trips
      summary: Get a specific place details
      description: Returns details of a specific place in a day
      operationId: getDayPlace
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          description: ID of the day
          required: true
          schema:
            type: string
            format: uuid
        - name: placeId
          in: path
          description: ID of the place
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - trips
      summary: Update a specific place
      description: Updates details of a specific place in a day
      operationId: updateDayPlace
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          description: ID of the day
          required: true
          schema:
            type: string
            format: uuid
        - name: placeId
          in: path
          description: ID of the place
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Updated place information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceUpdate'
      responses:
        '200':
          description: Place updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - trips
      summary: Remove a place from a day
      description: Deletes a specific place from a day
      operationId: deleteDayPlace
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          description: ID of the day
          required: true
          schema:
            type: string
            format: uuid
        - name: placeId
          in: path
          description: ID of the place
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Place deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/files:
    get:
      tags:
        - trips
      summary: Get all files attached to a trip
      description: Returns all files attached to a specific trip
      operationId: getTripFiles
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - trips
      summary: Attach a file to a trip
      description: Uploads and attaches a file to a specific trip
      operationId: addTripFile
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
                  description: Optional description of the file
      responses:
        '201':
          description: File added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File too large
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/files/{fileId}:
    get:
      tags:
        - trips
      summary: Get a specific file
      description: Downloads a specific file attached to a trip
      operationId: getTripFile
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: fileId
          in: path
          description: ID of the file
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - trips
      summary: Delete a file from a trip
      description: Removes a specific file from a trip
      operationId: deleteTripFile
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: fileId
          in: path
          description: ID of the file
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: File deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/places/{placeId}/files:
    get:
      tags:
        - trips
      summary: Get all files attached to a place
      description: Returns all files attached to a specific place
      operationId: getPlaceFiles
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: placeId
          in: path
          description: ID of the place
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - trips
      summary: Attach a file to a place
      description: Uploads and attaches a file to a specific place
      operationId: addPlaceFile
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: placeId
          in: path
          description: ID of the place
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
                  description: Optional description of the file
      responses:
        '201':
          description: File added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File too large
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/map:
    get:
      tags:
        - trips
      summary: Get map data for a trip
      description: Returns geographic data for all places in a trip for map visualization
      operationId: getTripMapData
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripMapData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/share:
    post:
      tags:
        - sharing
      summary: Share a trip with another user
      description: Shares a trip with another user by email or username
      operationId: shareTrip
      parameters:
        - name: tripId
          in: path
          description: ID of the trip to share
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Sharing details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  description: Email or username of the user to share with
                permission:
                  type: string
                  enum: [view, edit]
                  default: view
                  description: Permission level to grant to the user
              required:
                - recipient
      responses:
        '200':
          description: Trip shared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  shareId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/share/{shareId}:
    delete:
      tags:
        - sharing
      summary: Remove sharing for a user
      description: Removes sharing access for a specific user
      operationId: removeSharing
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
        - name: shareId
          in: path
          description: ID of the share record
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Sharing removed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /trips/{tripId}/collaborators:
    get:
      tags:
        - sharing
      summary: Get all collaborators for a trip
      description: Returns all users who have access to a trip
      operationId: getTripCollaborators
      parameters:
        - name: tripId
          in: path
          description: ID of the trip
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collaborator'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todo-lists:
    get:
      tags:
        - todo-lists
      summary: Get all todo lists
      description: Returns all todo lists created by the authenticated user
      operationId: getAllTodoLists
      parameters:
        - name: limit
          in: query
          description: Maximum number of todo lists to return
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Number of todo lists to skip for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  todoLists:
                    type: array
                    items:
