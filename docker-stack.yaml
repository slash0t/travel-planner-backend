services:
  postgresql:
    image: postgres:17
    env_file:
      - ./envfile
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5438:5438"
    volumes:
      - /home/deploy/postgres_data:/var/lib/postgresql/data

  liquibase-migrations:
    image: liquibase/liquibase:4.29
    env_file:
      - ./envfile
    depends_on:
      - postgresql
    command:
      - --searchPath=/changesets
      - --changelog-file=master.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://postgresql:5438/travelPlannerDB
      - --username=${DB_USERNAME}
      - --password=${DB_PASSWORD}
      - update
    volumes:
      - /home/deploy/travel-planner-backend/migrations:/changesets
    deploy:
      restart_policy:
        condition: none

  auth-service:
    image: ghcr.io/slash0t/putevod-auth:latest
    env_file:
      - ./envfile
    depends_on:
      - postgresql
      - liquibase-migrations
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5438/travelPlannerDB
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"
    deploy:
      update_config:
        order: start-first

  planner-service:
    image: ghcr.io/slash0t/putevod-planner:latest
    env_file:
      - ./envfile
    depends_on:
      - postgresql
      - liquibase-migrations
      - auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5438/travelPlannerDB
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8082:8082"
    deploy:
      update_config:
        order: start-first

  external-service:
    image: ghcr.io/slash0t/putevod-external:latest
    env_file:
      - ./envfile
    depends_on:
      - postgresql
      - liquibase-migrations
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5438/travelPlannerDB
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8083:8083"
    deploy:
      update_config:
        order: start-first

  library-service:
    image: ghcr.io/slash0t/putevod-library:latest
    env_file:
      - ./envfile
    depends_on:
      - postgresql
      - liquibase-migrations
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5438/travelPlannerDB
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8084:8084"
    deploy:
      update_config:
        order: start-first

volumes:
  postgres_data: