server:
  port: ${SERVER_PORT_LIBRARY}

spring:
  application:
    name: library-service
  liquibase:
    enabled: false
  security:
    user:
      name: admin
      password: secret
      roles: ADMIN
  datasource:
    url: jdbc:postgresql://localhost:5438/travelPlannerDB
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

services:
  planner:
    url: ${PLANNER_SERVICE_URL}
  auth:
    url: ${AUTH_SERVICE_URL}

auth:
  token: ${AUTH_SERVICE_TOKEN:service_token_for_development}
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    csrf:
      enabled: false
  packages-to-scan: ru.putevod.app.library.controller
  group-configs:
    - group: library-api
      paths-to-match: /api/v1/routes/**
      display-name: Библиотека маршрутов API

logging:
  level:
    org.springframework.web: INFO
    ru.putevod.app.library: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE 