server:
  port: ${SERVER_PORT_LIBRARY}

spring:
  application:
    name: library-service
  liquibase:
    enabled: false
  security:
    user:
      name: admin
      password: secret
      roles: ADMIN
  datasource:
    url: jdbc:postgresql://localhost:5438/travelPlannerDB
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 10000
      idle-timeout: 180000
      max-lifetime: 300000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      auto-commit: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

services:
  planner:
    url: ${PLANNER_SERVICE_URL}
  auth:
    url: ${AUTH_SERVICE_URL}

auth:
  token: ${AUTH_SERVICE_TOKEN:service_token_for_development}

app:
  appmetrica:
    enabled: ${APPMETRICA_ENABLED:false}
    post-api-key: ${APPMETRICA_POST_API_KEY:}
    application-id: ${APPMETRICA_APPLICATION_ID:}

springdoc:
  api-docs:
    path: /api-docs-library
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: list
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    csrf:
      enabled: false
  packages-to-scan: ru.putevod.app.library.controller
  paths-to-match: /api/v1/**

logging:
  level:
    org.springframework.web: INFO
    ru.putevod.app.library: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
    ru.putevod.app.library.service.MetricsService: DEBUG
    ru.putevod.app.library.aspect.MetricsAspect: DEBUG

# Настройки мониторинга и метрик
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        operation.duration.seconds: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        operation.duration.seconds: 0.5,0.95,0.99

---
# Профиль для сборки (отключает JPA)
spring:
  config:
    activate:
      on-profile: build
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

---
# Профиль для CI/CD среды
spring:
  config:
    activate:
      on-profile: ci
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 180000
      max-lifetime: 300000

---
# Профиль для тестирования
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 5000 