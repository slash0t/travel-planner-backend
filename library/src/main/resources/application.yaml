server:
  port: ${SERVER_PORT_LIBRARY}

spring:
  application:
    name: library-service
  liquibase:
    enabled: false
  security:
    user:
      name: admin
      password: secret
      roles: ADMIN
  datasource:
    url: jdbc:postgresql://localhost:5438/travelPlannerDB
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 10000
      idle-timeout: 180000
      max-lifetime: 300000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      auto-commit: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

services:
  planner:
    url: ${PLANNER_SERVICE_URL}
  auth:
    url: ${AUTH_SERVICE_URL}

auth:
  token: ${AUTH_SERVICE_TOKEN:service_token_for_development}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: list
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    csrf:
      enabled: false
  packages-to-scan: ru.putevod.app.library.controller
  paths-to-match: /api/v1/**

logging:
  level:
    org.springframework.web: INFO
    ru.putevod.app.library: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG

---
# Профиль для CI/CD среды
spring:
  config:
    activate:
      on-profile: ci
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 180000
      max-lifetime: 300000

---
# Профиль для тестирования
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 5000 