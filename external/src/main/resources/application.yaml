server:
  port: ${SERVER_PORT_EXTERNAL}

app:
  external-api:
    openTripMapApiKey: ${OPENTRIPMAP_API_KEY}
    openTripMapBaseUrl: ${OPENTRIPMAP_BASE_URL}
    yandexGeoSuggestApiKey: ${YANDEX_GEOSUGGEST_API_KEY}
    yandexGeoSuggestBaseUrl: ${YANDEX_GEOSUGGEST_BASE_URL}
    yandex-geocoder-api-key: ${YANDEX_GEOCODER_API_KEY}
    yandex-geocoder-base-url: ${YANDEX_GEOCODER_BASE_URL}

logging:
  level:
    ru.putevod.app: DEBUG
    org.springdoc: DEBUG

spring:
  application:
    name: putevod-external-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  security:
    user:
      name: ${SPRING_SECURITY_USER}
      password: ${SPRING_SECURITY_PASSWORD}

services:
  auth:
    url: ${AUTH_SERVICE_URL}

springdoc:
  api-docs:
    path: /api-docs-external
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
  packages-to-scan: ru.putevod.app.external.controller
  paths-to-match: /api/v1/**
  group-configs:
    - group: places-api
      paths-to-match: /api/v1/places/**
      display-name: Places API
    - group: ai-api
      paths-to-match: /api/v1/ai/**
      display-name: AI Services API




auth:
  token: ${AUTH_SERVICE_TOKEN:service_token_for_development}
