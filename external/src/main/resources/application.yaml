server:
  port: 8080
  servlet:
    context-path:

app:
  external-api:
    openTripMapApiKey: ${OPEN_TRIP_MAP_API_KEY}
    openTripMapBaseUrl: ${OPEN_TRIP_MAP_BASE_URL}

logging:
  level:
    ru.putevod.app: DEBUG
    org.springdoc: DEBUG

spring:
  application:
    name: putevod-external-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  security:
    user:
      name: admin
      password: admin

services:
  auth:
    url: ${AUTH_SERVICE_URL}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
  packages-to-scan: ru.putevod.app.external.controller
  paths-to-match: /api/v1/**
  group-configs:
    - group: places-api
      paths-to-match: /api/v1/places/**
      display-name: Places API
    - group: ai-api
      paths-to-match: /api/v1/ai/**
      display-name: AI Services API

auth:
  token: ${AUTH_SERVICE_TOKEN:service_token_for_development}
